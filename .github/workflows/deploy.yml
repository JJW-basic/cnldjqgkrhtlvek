name: cd.yml

on:
  push:
    branches:
      - main

jobs:
  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build React App
        run: npm run build

      - name: Upload frontend build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: dist/
          retention-days: 1

  build-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push FastAPI Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: app/Dockerfile
          platforms: linux/amd64
          push: true
          # 최신 태그와 커밋 SHA 태그를 동시 생성하여 이미지 롤백/추적 가능성 확보
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/${{ secrets.DOCKER_REPOSITORY }}:app-latest
            ${{ secrets.DOCKER_USERNAME }}/${{ secrets.DOCKER_REPOSITORY }}:app-${{ github.sha }}

      - name: Build and Push AI Worker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ai_worker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/${{ secrets.DOCKER_REPOSITORY }}:ai-latest
            ${{ secrets.DOCKER_USERNAME }}/${{ secrets.DOCKER_REPOSITORY }}:ai-${{ github.sha }}

  deploy:
    runs-on: self-hosted
    needs: [build-frontend, build-backend]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download frontend build artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: ./dist-temp

      - name: Prepare project directory on Host
        run: |
          # EC2 호스트 프로젝트 폴더 구조 확인 및 준비
          mkdir -p ~/project/nginx ~/project/dist
          
          # 프론트엔드 정적 파일 동기화
          rm -rf ~/project/dist/*
          cp -r ./dist-temp/* ~/project/dist/
          rm -rf ./dist-temp
          
          # Docker Compose 및 Nginx 설정 복사
          cp docker-compose.prod.yml ~/project/docker-compose.yml
          
          # Nginx 설정 파일 복사 (https 설정 기본 적용)
          cp nginx/prod_https.conf ~/project/nginx/default.conf

      - name: Log in to Docker Hub on EC2
        run: |
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Write production .env file
        run: |
          # GitHub Secret 'PROD_ENV_FILE'에 envs/.prod.env 내용 전체를 등록해 두면
          # 배포 시 EC2 호스트에 .env 파일로 직접 주입됩니다.
          # ⚠️ GitHub Settings → Secrets → PROD_ENV_FILE 에 실제 .env 내용을 붙여넣기 하세요.
          echo "${{ secrets.PROD_ENV_FILE }}" > ~/project/.env

      - name: Deploy Containers
        run: |
          cd ~/project

          # 컨테이너 풀링 및 서비스 백그라운드 재시작
          docker compose pull fastapi ai-worker
          docker compose up -d --no-deps fastapi ai-worker nginx certbot

          # Nginx DNS 캐시 갱신 (fastapi 컨테이너 재생성 후 502 방지)
          docker compose restart nginx

      - name: Cleanup old Docker images
        run: |
          docker image prune -af

