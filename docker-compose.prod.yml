services:
  # 1. Redis (메시지 브로커 및 캐싱)
  # ⚠️ 보안: 프로덕션에서 Redis는 내부 네트워크(ws)에서만 접근 가능하도록 ports 노출 제거
  redis:
    image: redis:alpine
    container_name: redis
    restart: always
    networks:
      - ws
    # ports 제거: Redis는 외부에서 직접 접근 불가 (컨테이너 내부 통신만 허용)
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # 2. API Server (FastAPI)
  fastapi:
    container_name: fastapi
    image: ${DOCKER_USER}/${DOCKER_REPOSITORY}:app-${APP_VERSION}
    platform: linux/arm64  # OCI Ampere A1 (ARM64) 호환
    env_file: .env
    restart: always
    networks:
      - ws
    depends_on:
      redis:
        condition: service_healthy

  # 3. AI Worker (MLP 추론)
  ai-worker:
    container_name: ai-worker
    image: ${DOCKER_USER}/${DOCKER_REPOSITORY}:ai-${AI_WORKER_VERSION}
    platform: linux/arm64  # OCI Ampere A1 (ARM64) 호환
    env_file: .env
    environment:
      - PYTHONUNBUFFERED=1
    restart: always
    mem_reservation: 512M
    mem_limit: 1G
    memswap_limit: 1G
    networks:
      - ws
    depends_on:
      redis:
        condition: service_healthy

  # 4. Nginx (리버스 프록시 + React SPA 서빙 + SSL)
  nginx:
    container_name: nginx
    image: nginx:latest
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./dist:/usr/share/nginx/html:ro  # React SPA 빌드 산출물 서빙
      - certbot-conf:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    ports:
      - "80:80"
      - "443:443"
    networks:
      - ws
    restart: always
    depends_on:
      - fastapi

  # 5. certbot: SSL 인증서 자동 갱신 (48h 주기)
  certbot:
    image: certbot/certbot
    container_name: auto-certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot; sleep 48h & wait $${!}; done;'"
    volumes:
      - certbot-conf:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    networks:
      - ws
    depends_on:
      - nginx

volumes:
  certbot-conf:
    name: certbot-conf
  certbot-www:
    name: certbot-www

networks:
  ws:
    name: ws
    driver: bridge
