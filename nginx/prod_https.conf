upstream fastapi {
    server fastapi:8000;
}

# http → https 리다이렉트 (Duck DNS 단일 도메인)
server {
    listen 80;
    # Duck DNS 단일 도메인 사용 (예: your-name.duckdns.org)
    # ⚠️ 와일드카드(*.duckdns.org) 인증서는 HTTP-01 방식으로 발급 불가
    # 반드시 OCI Reserved Public IP를 Duck DNS에 매핑 후 certbot.sh 실행할 것
    server_name 도메인;

    # certbot HTTP-01 챌린지용 (SSL 자동 갱신 시 필요)
    location /.well-known/acme-challenge/ {
       root /var/www/certbot;
    }

    # 모든 HTTP 요청을 HTTPS로 리다이렉트
    location / {
        return 301 https://$host$request_uri;
    }
}

# https 처리
server {
    server_name 도메인;

    listen 443 ssl;

    ssl_certificate /etc/letsencrypt/live/도메인/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/도메인/privkey.pem;

    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # FastAPI API 요청 프록시
    location /api/ {
        proxy_pass http://fastapi;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
    }

    # React SPA 서빙 (index.html fallback for client-side routing)
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
