upstream fastapi {
    server fastapi:8000;
}

server {
    # Duck DNS 단일 도메인 사용 (예: your-name.duckdns.org)
    # certbot.sh 실행 전 반드시 OCI Reserved Public IP를 Duck DNS에 매핑할 것
    server_name 도메인 혹은 OCI_PUBLIC_IP;

    listen 80;

    # certbot HTTP-01 챌린지용 (SSL 인증서 갱신 시 필요)
    location /.well-known/acme-challenge/ {
       root /var/www/certbot;
    }

    # FastAPI API 요청 프록시
    location /api/ {
        proxy_pass http://fastapi;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
    }

    # React SPA 서빙 (index.html fallback for client-side routing)
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
